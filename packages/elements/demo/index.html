<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Optimize Planner — Web Component Demo</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      vietmap-optimize-planner { display: block; height: 100vh; padding: 16px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <vietmap-optimize-planner id="planner"></vietmap-optimize-planner>

    <!-- Local keys (gitignored). Copy keys.example.js -> keys.local.js. -->
    <script src="./keys.local.js"></script>
    <!-- Self-contained IIFE build (bundles Lit + core). -->
    <script src="../dist/index.global.js"></script>
    <script>
      const { api: API_KEY = '', map: MAP_KEY = '' } = window.__DEMO_KEYS__ || {}

      const planner = document.getElementById('planner')
      const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
      const today = new Date()
      const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1)
      const DAY1 = iso(today), DAY2 = iso(tomorrow)

      planner.apiKey = API_KEY
      planner.tileKey = MAP_KEY
      planner.vehicles = [
        { id: 'xe1', plate: '51C-123.45', name: 'Nguyễn Văn A', vehicleType: 'Xe tải 1.5T', capacity: [1500], start: [106.66017, 10.76262], workingHours: [480, 1080], skills: ['Lạnh', 'Cồng kềnh'], cities: ['Quận 1', 'Quận 3'] },
        { id: 'xe2', plate: '59X1-678.90', name: 'Trần Thị B', vehicleType: 'Xe máy', capacity: [50], start: [106.70, 10.78], workingHours: [480, 1080], skills: ['Giao nhanh'], cities: ['Bình Thạnh'] },
      ]

      // The host owns the jobs; the planner only reports the selected day.
      const JOBS_BY_DAY = {
        [DAY1]: {
          services: [
            { id: 'DV-103', code: 'DV-103', name: 'Lắp đặt Điểm C', location: [106.6751, 10.76543], serviceMinutes: 5, skills: ['Lạnh'] },
            { id: 'DV-105', code: 'DV-105', name: 'Bảo trì Điểm E', location: [106.65, 10.75], serviceMinutes: 8 },
          ],
          shipments: [
            { id: 'DH-201', code: 'ĐH-201', name: 'Đơn Kho→A', pickup: { location: [106.66017, 10.76262], serviceMinutes: 5 }, delivery: { location: [106.70098, 10.77689], serviceMinutes: 10 }, priority: 90, skills: ['Lạnh'] },
            { id: 'DH-202', code: 'ĐH-202', name: 'Đơn Kho→B', pickup: { location: [106.66017, 10.76262] }, delivery: { location: [106.68411, 10.78021] } },
          ],
        },
        [DAY2]: {
          services: [{ id: 'DV-210', code: 'DV-210', name: 'Bảo trì Điểm F', location: [106.72, 10.79], serviceMinutes: 8 }],
          shipments: [{ id: 'DH-220', code: 'ĐH-220', name: 'Đơn Kho→G', pickup: { location: [106.66017, 10.76262] }, delivery: { location: [106.64, 10.74] } }],
        },
      }
      const loadDay = (day) => {
        const jobs = JOBS_BY_DAY[day] || { services: [], shipments: [] }
        planner.services = jobs.services
        planner.shipments = jobs.shipments
      }

      planner.day = DAY1
      loadDay(DAY1)
      planner.addEventListener('vm-daychange', (e) => loadDay(e.detail.day))
    </script>
  </body>
</html>
